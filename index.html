<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-Club</title>
  <meta name="description" content="F-Club — клуб для своих. Контакты, расписание, запись.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d10;
      --card: #16161b;
      --line: #26262e;
      --text: #f2f2f5;
      --muted: #9a9aa6;
      --accent: #c6ff3d;
      --accent-ink: #0d0d10;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(600px 400px at 85% -10%, rgba(198,255,61,.12), transparent 60%),
        radial-gradient(500px 400px at -10% 110%, rgba(198,255,61,.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 32px 24px 24px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      animation: rise .6s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .logo {
      width: 88px; height: 88px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid; place-items: center;
      background: var(--accent);
      color: var(--accent-ink);
      font: 700 40px/1 Unbounded, sans-serif;
      transform: rotate(-6deg);
    }
    h1 { font: 700 30px/1.1 Unbounded, sans-serif; letter-spacing: -.01em; }
    .tagline { margin-top: 8px; color: var(--muted); font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0 24px; }
    .tag {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }
    .links { display: grid; gap: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #1c1c22;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .btn:hover { transform: translateY(-2px); border-color: #3a3a44; background: #212128; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.primary:hover { background: #d4ff6a; }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .info {
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid; gap: 6px;
      font-size: 14px; color: var(--muted);
    }
    .info b { color: var(--text); font-weight: 500; }
    footer { margin-top: 20px; font-size: 12px; color: #5d5d68; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">F</div>
    <h1>F-Club</h1>
    <p class="tagline">Клуб для своих. Тренировки, встречи, движ.</p>

    <div class="tags">
      <span class="tag">Тренировки</span>
      <span class="tag">Сообщество</span>
      <span class="tag">События</span>
    </div>

    <nav class="links">
      <a class="btn primary" href="https://t.me/fedonko" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 2.8c.9-.3 1.6.2 1.4 1.5Z"/></svg>
        Записаться в Telegram
      </a>
      <a class="btn" href="https://instagram.com/your_username" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        Instagram
      </a>
      <a class="btn" href="tel:+70000000000">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
        +7 (000) 000-00-00
      </a>
    </nav>

    <div class="info">
      <div>📍 <b>Город, улица, дом</b></div>
      <div>🕒 Пн–Пт 10:00–22:00 · Сб–Вс 11:00–20:00</div>
    </div>

    <footer>© <span id="y"></span> F-Club</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
